<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Meu Primeiro Formulário</h1>

    <form action="cadastro.php" autocomplete="off">
        <p><label for="iNome">Nome:</label> 
            <input type="text" name="Nome" id="iNome"></p>
        <p><label for="iSobrenome">Sobrenome:</label> 
            <input type="text" name="Sobrenome" id="iSobrenome"></p>
        <p><input type="submit" value="Enviar"></p>
    </form>

    <h1>Segundo Formulário</h1>
    <form action="cadastro.php" autocomplete="off" method="post">
        <p>
            <label for="Nome">Nome:</label>
            <input type="text" name="Nome" id="Nome" required minlength="5" maxlength="19" placeholder="Usuario">
        </p>
        <p>
            <label for="Senha">Senha:</label>
            <input type="password" name="Senha" id="Senha" required minlength="8" placeholder="Senha">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

</body>
</html>
